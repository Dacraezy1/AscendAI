name: Build AscendAI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscendAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Generate Action Summary
        run: |
          echo "### 🚀 AscendAI APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "The debug APK has been successfully compiled and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`AscendAI-Debug-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Location in Artifact:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "You can download it directly from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
